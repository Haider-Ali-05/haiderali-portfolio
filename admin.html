<!DOCTYPE html>
<html lang="en" data-theme="cyber">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Console Control | Admin Panel</title>
  
  <!-- SEO & Favicon -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="https://ihaiderali.dev/uploads/profile/avatar.jpg">
  <link rel="apple-touch-icon" href="https://ihaiderali.dev/uploads/profile/avatar.jpg">

  <!-- Styles -->
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- 1. Password Verification Gateway -->
  <div class="admin-login" id="admin-login">
    <div class="admin-login-card glass glow">
      <div class="admin-login-logo">&gt; admin_console_auth</div>
      <form id="admin-login-form">
        <div class="form-group" style="text-align: left;">
          <label class="form-label" for="admin-pass">Access Code:</label>
          <input class="form-input" type="password" id="admin-pass" placeholder="Enter passphrase" required>
        </div>
        <button class="btn-submit" type="submit">Verify Authority</button>
      </form>
    </div>
  </div>

  <!-- GitHub Token View Removed for Security -->

  <!-- 3. SPA Admin Layout Dashboard -->
  <div class="admin-container" id="admin-layout" style="display: none;">
    
    <!-- Sidebar Controls -->
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">&gt; main_core</div>
      </div>
      <nav class="sidebar-nav">
        <a class="sidebar-link active" href="#" data-page="dashboard">
          <span class="sidebar-icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a class="sidebar-link" href="#" data-page="profile">
          <span class="sidebar-icon">👤</span>
          <span>Profile</span>
        </a>
        <a class="sidebar-link" href="#" data-page="projects">
          <span class="sidebar-icon">📁</span>
          <span>Projects</span>
        </a>
        <a class="sidebar-link" href="#" data-page="experience">
          <span class="sidebar-icon">💼</span>
          <span>Experience</span>
        </a>
        <a class="sidebar-link" href="#" data-page="education">
          <span class="sidebar-icon">🎓</span>
          <span>Education</span>
        </a>
        <a class="sidebar-link" href="#" data-page="skills">
          <span class="sidebar-icon">⚡</span>
          <span>Skills</span>
        </a>
        <a class="sidebar-link" href="#" data-page="tools">
          <span class="sidebar-icon">🔧</span>
          <span>Tools</span>
        </a>
        <a class="sidebar-link" href="#" data-page="messages">
          <span class="sidebar-icon">📨</span>
          <span>Messages</span>
        </a>
        <a class="sidebar-link" href="#" data-page="analytics">
          <span class="sidebar-icon">📈</span>
          <span>Analytics</span>
        </a>
        <a class="sidebar-link" href="#" data-page="settings">
          <span class="sidebar-icon">⚙️</span>
          <span>Settings</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-status" id="sidebar-status">node: connected</div>
        <button class="btn-logout" id="admin-logout-btn">
          <span>Close Session</span>
        </button>
      </div>
    </aside>

    <!-- Main Dynamic Content Canvas -->
    <main class="admin-main">
      <header class="admin-header">
        <h1 class="admin-title" id="admin-page-title">Dashboard</h1>
        <div id="save-status-indicator" style="font-family: monospace; font-size: 0.9rem; color: var(--text-muted);">synced</div>
      </header>
      <div id="admin-content">
        <!-- Rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Admin Toast Notifications -->
  <div id="admin-toast-container"></div>

  <!-- Dependencies & SPA JS Modules -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
  <script src="js/admin/github-api.js"></script>
  <script src="js/admin/auth.js"></script>
  <script src="js/admin/dashboard.js"></script>
  <script src="js/admin/editor.js"></script>
  <script src="js/admin/settings.js"></script>

  <!-- Router Setup Script -->
  <script src="js/admin/boot.js"></script>
</body>
</html>
